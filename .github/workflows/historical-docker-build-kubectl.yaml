    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ghcr.io/userbradley/kubectl
          annotations: |
            org.opencontainers.image.description="Historical Kubectl image"
          labels: |
            org.opencontainers.image.source="https://github.com/userbradley/kubectl"
          tags: |
            type=raw,value=${{ matrix.version }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Download Kubectl
        run: |
          mkdir -p bin/amd64 bin/arm64
          curl -sSLo bin/amd64/kubectl "https://dl.k8s.io/release/v${{ matrix.version }}/bin/linux/amd64/kubectl"
          curl -sSLo bin/arm64/kubectl "https://dl.k8s.io/release/v${{ matrix.version }}/bin/linux/arm64/kubectl"
          chmod +x bin/amd64/kubectl bin/arm64/kubectl
      - name: Buildah Action
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ghcr.io/userbradley/kubectl
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./Containerfile
          platforms: linux/amd64,linux/arm64
      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ${{ steps.build_image.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
